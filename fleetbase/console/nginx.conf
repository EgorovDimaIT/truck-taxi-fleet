server {
    listen       4200;
    server_name  localhost;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }

    # JS/CSS/фонты/маппинги -- в этой сборке имена файлов не хешируются (dev-режим),
    # поэтому используем no-cache: браузер кеширует локально, но всегда проверяет
    # актуальность через ETag/Last-Modified (быстрый 304 вместо полной перекачки),
    # и сразу подхватит новый файл после ребилда -- никакого риска "залипшего" кеша.
    location ~* \.(js|css|js\.map|css\.map|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Изображения можно кешировать чуть более уверенно
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

     # Serve runtime config with no cache
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }
}
