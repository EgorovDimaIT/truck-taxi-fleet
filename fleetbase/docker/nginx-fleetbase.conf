# Fleetbase — единая точка входа
# Console SPA + API proxy
server {
    listen 80;
    server_name truck-taxi.com www.truck-taxi.com;

    server_tokens off;
    client_max_body_size 600M;

    # ── API — все не-asset пути Fleetbase ───────────────────────────────
    # Laravel маршруты: /int/, /api/, /v1/, /auth/, /lookup/ и т.д.
    location ~ ^/(int|api|v1|auth|lookup|user|billing|webhook|module-settings|imex|navigator|registry|password|sanctum|laravel-websockets|broadcasting|storage) {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # ── Console (Ember SPA) — всё остальное ────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

# Прямой доступ к API (fallback)
server {
    listen 18888;
    server_name _;

    server_tokens off;
    client_max_body_size 600M;

    location / {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }
}
