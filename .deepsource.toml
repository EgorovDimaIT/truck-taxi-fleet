version = 1

exclude_patterns = [
  "**/node_modules/**",
  "**/vendor/**",
  "**/dist/**",
  "**/build/**",
  "**/public/**",
  "**/coverage/**",
  "**/*.min.js",
  "**/*.bundle.js",
  "fleetbase/api/**",
  "fleetbase/infra/**",
  "fleetbase/docker/**"
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs"]

[[transformers]]
name = "prettier"
enabled = true
